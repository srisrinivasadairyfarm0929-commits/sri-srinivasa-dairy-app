<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — SSDF</title>
  <link rel="stylesheet" href="style.css">
  <style>
    table { width:100%; border-collapse:collapse; color:#fff; margin-top:16px; font-size:13px; }
    th,td { padding:8px; border-bottom:1px solid rgba(255,255,255,.1); text-align:left; }
    th { background:rgba(255,255,255,.08); }
    input,select { padding:6px; border-radius:6px; border:none; background:#222; color:#fff; }
    .tabs { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
    .tab { padding:10px 16px; background:rgba(255,255,255,.1); border-radius:10px; cursor:pointer; font-size:13px; }
    .tab.active { background:linear-gradient(135deg,#2e7d32,#66bb6a); }
    .stats { display:flex; gap:12px; margin-top:20px; flex-wrap:wrap; }
    .stat { flex:1; min-width:120px; background:rgba(255,255,255,.08); padding:16px; border-radius:16px; text-align:center; }
    .stat h3 { font-size:24px; color:#ffd54f; }
    .chart { display:flex; align-items:flex-end; gap:10px; height:180px; margin-top:20px; padding:20px; background:rgba(255,255,255,.05); border-radius:16px; }
    .bar-wrap { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
    .bar { width:100%; background:linear-gradient(180deg,#66bb6a,#2e7d32); border-radius:8px 8px 0 0; min-height:4px; }
    .bar-wrap span { font-size:11px; margin-top:6px; }
    .glass { max-width:1100px; }
    .hidden { display:none; }
  </style>
</head>
<body>
  <div class="bg-animated"></div>

  <header class="fade-in">
    <h1>⚙️ Admin — SSDF</h1>
    <a href="index.html" class="btn-track">← Shop</a>
  </header>

  <main>
    <div id="loginBox" class="glass">
      <h2>Login</h2>
      <input type="password" id="pwd" placeholder="Password">
      <button class="submit-btn" onclick="login()">Enter</button>
    </div>

    <div id="panel" class="glass hidden">
      <div class="tabs">
        <div class="tab active" onclick="tab('orders',this)">📦 Orders</div>
        <div class="tab" onclick="tab('products',this)">🛒 Products</div>
        <div class="tab" onclick="tab('coupons',this)">🎟️ Coupons</div>
        <div class="tab" onclick="tab('analytics',this)">📊 Analytics</div>
      </div>

      <div id="orders">
        <button class="submit-btn" onclick="loadOrders()" style="max-width:160px">🔄 Refresh</button>
        <div style="overflow-x:auto"><table id="ordersTable"></table></div>
      </div>

      <div id="products" class="hidden">
        <h3>Add Product</h3>
        <input id="pName" placeholder="Name">
        <input id="pPrice" type="number" placeholder="Price">
        <input id="pStock" type="number" placeholder="Stock" value="100">
        <button class="submit-btn" onclick="addProduct()" style="max-width:160px">+ Add</button>
        <table id="productsTable"></table>
      </div>

      <div id="coupons" class="hidden">
        <h3>Add Coupon</h3>
        <input id="cCode" placeholder="CODE">
        <select id="cType">
          <option value="percent">%</option>
          <option value="flat">₹</option>
        </select>
        <input id="cValue" type="number" placeholder="Value">
        <input id="cMin" type="number" placeholder="Min order" value="0">
        <input id="cLimit" type="number" placeholder="Limit" value="100">
        <button class="submit-btn" onclick="addCoupon()" style="max-width:160px">+ Add</button>
        <table id="couponsTable"></table>
      </div>

      <div id="analytics" class="hidden">
        <div class="stats" id="stats"></div>
        <div class="chart" id="chart"></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>
  <script>
    function tab(name, el) {
      document.querySelectorAll('.tabs .tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      ['orders','products','coupons','analytics'].forEach(t => document.getElementById(t).classList.add('hidden'));
      document.getElementById(name).classList.remove('hidden');
      if (name === 'orders') loadOrders();
      if (name === 'products') loadProducts();
      if (name === 'coupons') loadCoupons();
      if (name === 'analytics') loadAnalytics();
    }
  </script>
</body>
</html>
