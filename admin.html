<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — SSDF</title>
  <link rel="stylesheet" href="style.css">
  <style>
    table { width:100%; border-collapse:collapse; color:#fff; margin-top:16px; font-size:12px; }
    th,td { padding:8px; border-bottom:1px solid rgba(255,255,255,.1); text-align:left; }
    th { background:rgba(255,255,255,.08); }
    input,select { padding:6px; border-radius:6px; border:none; background:#222; color:#fff; font-size:12px; }
    .tabs { display:flex; gap:6px; margin-bottom:20px; flex-wrap:wrap; }
    .tab { padding:9px 14px; background:rgba(255,255,255,.1); border-radius:10px; cursor:pointer; font-size:12px; transition:0.3s; }
    .tab.active { background:linear-gradient(135deg,#2e7d32,#66bb6a); }
    .stats { display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; }
    .stat { flex:1; min-width:100px; background:rgba(255,255,255,.08); padding:14px; border-radius:14px; text-align:center; }
    .stat h3 { font-size:22px; color:#ffd54f; }
    .stat p { font-size:11px; opacity:0.7; }
    .chart { display:flex; align-items:flex-end; gap:8px; height:160px; margin-top:20px; padding:16px; background:rgba(255,255,255,.05); border-radius:16px; }
    .bar-wrap { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
    .bar { width:100%; background:linear-gradient(180deg,#66bb6a,#2e7d32); border-radius:8px 8px 0 0; min-height:4px; }
    .bar-wrap span { font-size:10px; margin-top:4px; }
    .glass { max-width:1100px; }
    .hidden { display:none; }
    .slot-header { background:rgba(102,187,106,0.2); padding:10px; border-radius:10px; margin:16px 0 8px 0; font-weight:bold; font-size:14px; }
    .delivery-card { background:rgba(255,255,255,0.06); padding:12px; border-radius:10px; margin:6px 0; font-size:13px; }
    .delivery-card .row { display:flex; justify-content:space-between; padding:3px 0; }
    .delivery-card .items { font-size:12px; opacity:0.8; margin-top:6px; }

    #accessDenied {
      display:none;
      position:fixed; inset:0;
      background:linear-gradient(135deg, #0f0c29, #1b5e20);
      color:#fff;
      align-items:center; justify-content:center;
      text-align:center;
      padding:30px;
      z-index:10000;
    }
    #accessDenied.show { display:flex; }
    #accessDenied h1 { font-size:80px; margin-bottom:20px; }
    #accessDenied h2 { font-size:26px; margin-bottom:12px; }
    #accessDenied p { opacity:0.7; line-height:1.6; }

    #loadingScreen {
      position:fixed; inset:0;
      background:linear-gradient(135deg, #1b5e20, #2e7d32);
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      color:#fff;
      z-index:9999;
    }
    #loadingScreen .spinner {
      width:60px; height:60px;
      border:4px solid rgba(255,255,255,0.2);
      border-top-color:#ffd54f;
      border-radius:50%;
      animation: spin 0.9s linear infinite;
      margin-bottom:20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loadingScreen.hide { display:none; }
  </style>
</head>
<body>
  <div class="bg-animated"></div>

  <div id="loadingScreen">
    <div class="spinner"></div>
    <p style="font-size:14px;opacity:0.85">Verifying device access...</p>
  </div>

  <div id="accessDenied">
    <div>
      <h1>🔒</h1>
      <h2>Access Denied</h2>
      <p>This admin panel is restricted to the owner's device.</p>
      <p style="font-size:12px;opacity:0.5;margin-top:30px">🐄 Sri Srinivasa Dairy Farm</p>
    </div>
  </div>

  <div id="mainContent" style="display:none">
    <header class="fade-in" style="display:flex;justify-content:space-between;align-items:center;padding:16px 20px">
      <h1>⚙️ Admin — SSDF</h1>
      <div>
        <span style="font-size:11px;opacity:0.6;margin-right:8px" id="deviceLabel"></span>
        <a href="index.html" class="btn-track">← Shop</a>
      </div>
    </header>

    <main>
      <div id="panel" class="glass">
        <div class="tabs">
          <div class="tab active" onclick="tab('orders',this)">📦 Orders</div>
          <div class="tab" onclick="tab('delivery',this)">🚚 Delivery</div>
          <div class="tab" onclick="tab('products',this)">🛒 Products</div>
          <div class="tab" onclick="tab('coupons',this)">🎟️ Coupons</div>
          <div class="tab" onclick="tab('analytics',this)">📊 Analytics</div>
        </div>

        <div id="orders">
          <button class="submit-btn" onclick="loadOrders()" style="max-width:160px">🔄 Refresh</button>
          <div style="overflow-x:auto"><table id="ordersTable"></table></div>
        </div>

        <div id="delivery" class="hidden">
          <button class="submit-btn" onclick="loadDelivery()" style="max-width:180px">🔄 Refresh Today</button>
          <div id="deliveryList" style="margin-top:16px"></div>
        </div>

        <div id="products" class="hidden">
          <h3>Add Product</h3>
          <input id="pName" placeholder="Name">
          <input id="pPrice" type="number" placeholder="Price">
          <input id="pStock" type="number" placeholder="Stock" value="100">
          <button class="submit-btn" onclick="addProduct()" style="max-width:160px">+ Add</button>
          <table id="productsTable"></table>
        </div>

        <div id="coupons" class="hidden">
          <h3>Add Coupon</h3>
          <input id="cCode" placeholder="CODE">
          <select id="cType"><option value="percent">%</option><option value="flat">₹</option></select>
          <input id="cValue" type="number" placeholder="Value">
          <input id="cMin" type="number" placeholder="Min order" value="0">
          <input id="cLimit" type="number" placeholder="Limit" value="100">
          <button class="submit-btn" onclick="addCoupon()" style="max-width:160px">+ Add</button>
          <table id="couponsTable"></table>
        </div>

        <div id="analytics" class="hidden">
          <div class="stats" id="stats"></div>
          <div class="chart" id="chart"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js"></script>
  <script>
    function tab(name, el) {
      document.querySelectorAll('.tabs .tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      ['orders','delivery','products','coupons','analytics'].forEach(t => document.getElementById(t).classList.add('hidden'));
      document.getElementById(name).classList.remove('hidden');
      if (name === 'orders') loadOrders();
      if (name === 'delivery') loadDelivery();
      if (name === 'products') loadProducts();
      if (name === 'coupons') loadCoupons();
      if (name === 'analytics') loadAnalytics();
    }
  </script>
</body>
</html>
