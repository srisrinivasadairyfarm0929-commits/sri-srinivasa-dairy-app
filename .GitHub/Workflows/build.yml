name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        run: npm install

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp track.html www/track.html
          cp admin.html www/admin.html
          cp style.css www/style.css
          cp script.js www/script.js
          cp track.js www/track.js
          cp admin.js www/admin.js
          cp manifest.json www/manifest.json
          cp service-worker.js www/service-worker.js
          echo "--- www contents ---"
          ls -la www/
          echo "--- verifying index.html ---"
          test -f www/index.html && echo "index.html OK" || exit 1

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Fix gradlew permissions
        run: chmod +x android/gradlew

      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ssdf-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
