<div id="offlineScreen" class="hidden">
  <div class="offline-header">
    <h2>📡 No Internet</h2>
    <p>Play while we reconnect...</p>
  </div>
  <canvas id="gameCanvas" width="320" height="320"></canvas>
  <div class="game-score">Score: <span id="score">0</span> · Best: <span id="best">0</span></div>
  <div class="game-controls">
    <button class="dpad up" data-dir="up">▲</button>
    <div>
      <button class="dpad left" data-dir="left">◀</button>
      <button class="dpad down" data-dir="down">▼</button>
      <button class="dpad right" data-dir="right">▶</button>
    </div>
  </div>
  <p style="font-size:12px;opacity:0.7;text-align:center;margin-top:10px">Swipe or tap arrows 🐍</p>
  <button class="retry-btn" onclick="location.reload()">🔄 Retry Connection</button>
</div>
